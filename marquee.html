<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <div>
        <marquee width="60%" direction="down" height="100px" style="color: rgb(244, 174, 82);"><h1>This is a sample scrolling text that has scrolls texts to down.</h1></marquee>
        <marquee width="14%" direction="up" height="120px" style="font-family: 'Courier New', Courier, monospace;"><h2>This is a sample scrolling text that has scrolls texts to up.</h2> </marquee>
        <marquee width="20%" direction="left" height="50px" style="border: 1px outset    rgb(195, 245, 151); color: red;"><h3>This is a sample scrolling text that has scrolls texts to left</h3></marquee>
        <marquee width="50%" direction="right" height="100px"><h4>This is a sample scrolling text that has scrollls text to right</h4></marquee>
        <marquee behavior="scroll" direction="left" scrollamount="1" width="90%" height="50px"><h2>Slow Scrolling</h2></marquee>
        <marquee behavior="scroll" direction="right" scrollamount="20" width="100%"><h1>Very Fast Scrolling</h1></marquee>
     </div>
</body>
</html>
