<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Balls</title>
    <style>
        body{
         
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .wrapper{
            position: absolute;
            animation: move 10s linear infinite;
             top:20px;
             margin-top: 50px;
        }
        .ball{
            position: absolute;
            top: 20%;
            left: 0%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            animation: bounce 2s infinite ease-in;
        }
        .line{
            position: absolute;
            bottom: 280px;
            left: 0;
            width: 100%;
            height: 10px;
            background-color: rgb(231, 70, 70);
          
            animation: lines 4s infinite ease-in;
        }
        @keyframes move  {
            from{
                left:0;
            }
            to{
                left:100%;
            }
        }
        @keyframes bounce {
            0% {
                transform: translatex(0) translatey(0) ;
                /* top: 100px; */
                animation-timing-function: ease-in;
            }
            25%{
                transform:translatex(50px) translatey(100px) ;
            }
           50% {
            transform: translate(100);
                /* top: 400px;  */
                /* animation-timing-function: linear; */
            }
            75%{
              
            transform: translate(100px , -30px);
            }
            100%{
                transform:translate(200px , 0);
            }
        }
          
        
    </style>
</head>
<body>
    <div class="container">
        <div class="wrapper">
        <div class="ball" >
        </div>
       
        </div>
     </div>  
        
</body>
</html>
