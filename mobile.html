<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            gap: 20px;
            width: 1500px;
            height: 1000px;
            background-color: antiquewhite;
        }
        .left{
            margin: 10px;
            width: 750px;
            height: 700px;
            background-color: rgb(108, 157, 225);
            display: flex;
            gap: 10px;
        }
        .box1{
            margin: 40px;
            width: 300px;
            height: 300px;
            background-color: beige;
        }
        .right{
            margin: 10px;
            width: 750px;
            height: 700px;
            background-color: rgb(108, 157, 225);
        }
        img{
            margin: 40px;
            width: 600px;
            height: 600px;
        }
        @media (max-width:700px){
            .main{
            flex-direction: column;
                
            }
            .left{
             margin: 10px;
            width: 350px;
            height: 300px;
            background-color: rgb(108, 157, 225);
            display: flex;
            flex-direction: column;
            }
            .box1{
            margin: 20px;
            width: 150px;
            height: 150px;
            background-color: rgb(236, 236, 143);
            }
            .right{
            margin: 10px;
            width: 350px;
            height: 300px;
            background-color: rgb(108, 157, 225); 
            }
            img{
            margin: 40px;
            width: 200px;
            height: 200px;
            }
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="left">
            <div class="box1"></div>
            <div class="box1"></div>
        </div>
        <div class="right">
            <img src="nat1.jpg" alt="not found"> 
        </div>
    </div>
</body>
</html>
