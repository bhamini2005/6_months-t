<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>square</title>
    <style>
        .main{
             height: 100vh; 
            width: 100vw; 
            /* background-color: aqua; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dot{
            height: 500px;
            width: 500px;
            /* background-color: #fff; */
            border: 4px dotted   black;
            position: relative;

        }
        .square{
            position: absolute;
            height:60px;
            width:60px;
            /* background-color: antiquewhite; */
            animation: sq 2s linear infinite;
        }
        @keyframes sq {
            0%{background-color: brown;top:0px;left:0px;
            transform: rotate(0deg)}
            25%{background-color: brown;top:0;left:450px;
            transform: rotate(90deg);}
            50%{background-color: brown;top:450px;left:450px;
            transform: rotate(180deg);}
            75%{background-color: brown;top:450px;left:0px;
            transform: rotate(270deg);}
            100%{background-color: brown;top:0;left:0;
            transform: rotate(360deg);}
            
        }
         
    </style>
</head>
<body>
    <div class="main">
        <div class="dot">
            <div class="square"></div>
        </div>
    </div>
</body>
</html>
