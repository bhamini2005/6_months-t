<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .pro {
        cursor: pointer;
        /* position: absolute; */
        /* margin-top: 100px ;
        margin-left: 400px; */
        border: 2px solid #BADFDB;
        border-radius: 10px;
        /* padding: 10px; */
        padding: 20px 30px;
        /* width: 450px; */
        /* height: 400px; */
        background-color: #FFA4A4;
        /* transition: transform ease 0.7s; */

    }

    /* .pro:hover {
         transform: translate(0px,-10px); 
     } */

        margin-top: 30px;
        text-align: center;

    }

    .image:hover {
        transform: scale(1.1);
        /* transform: translate(0px ,-20px); */
    }

    img {
        border-radius: 10px;
        width: 400px;

    }

    button {
        border-radius: 5px;
        background-color: #f38989;
        padding: 10px;
        color: black;
    }

    h2,
    h3,
    p {
        color: #FCF9EA;
    }

    button:hover {
        background-color: rgb(234, 101, 137);

    }
</style>

<body>
    <div class="parent">
        <div class="pro">
