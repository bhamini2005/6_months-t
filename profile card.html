<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body{
            background-color: rgb(243, 244, 246);
            position: relative;

        }
        .Pro {
           
            align-items: center;
            width: 400px;
            height: 500px;
            background-color: mistyrose;
            border: 2px solid black;
            margin-top: 50px;
            margin-left: 300px;
            border-radius:  10px;
            padding: 10px;
            text-align: center;
            text-transform: capitalize;
            position: relative;
            cursor: pointer;
            transition: scale 0.5 ease;

        }
        .Pro:hover{
            box-shadow:  0 0 10px 10px rgba(142, 83, 116, 0.5);
            transform: scale(1.1);

        }
         img{
            cursor: pointer;
            width: 400px;
            height: 300px;
            border-radius: 5px;
          
        }
      
        .h2{
            color: teal;
            margin-top: 10px;

        }
        p{
            color: rgb(1, 49, 76); 
            font-size: large;
        }

            </style>
</head>
<body>
    <h1>Profile Card</h1>
    <div class="Pro">
        <img src="OIP (2).jpg" alt="profile photo">
        <h2>John Doe</h2>
        <p> Computer Student</p>
        <p>Lorem ipsum dolor sit amet consectetur 
            adipisicing elit. Quisquam, voluptatum 
            Lorem, ipsum dolor 
            sit amet consectetur adipisicing elit.
            Libero earum delectus ex et nulla?.</p>
    </div>

   
</body>
</html>
